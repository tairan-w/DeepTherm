[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deeptherm"
version = "1.0.0"
description = "Directed-bond message passing and global-attention thermochemistry prediction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2",
  "rdkit>=2023.9",
  "torch>=2.1",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["deeptherm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
